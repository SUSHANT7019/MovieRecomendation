{% extends 'base.html' %}

{% block title %}Recommendations - CineSet{% endblock %}

{% block content %}
<div class="section">
    <div class="container">
        <div class="section-header fade-in">
            <h1>Movie Recommendations</h1>
            <p class="text-secondary">Personalized recommendations based on mathematical similarity</p>
        </div>
        
        <!-- Control Panel -->
        <div class="card mb-4 fade-in">
            <div class="card-header">
                <h3 class="card-title">Generate Recommendations</h3>
            </div>
            <div class="card-body">
                <button id="generateBtn" class="btn btn-primary btn-lg">
                    🎯 Generate Recommendations
                </button>
                <p class="text-secondary mt-2" style="margin-bottom: 0;">
                    Based on your saved preferences. <a href="{% url 'preferences' %}">Edit preferences</a>
                </p>
            </div>
        </div>
        
        <!-- Results -->
        <div id="resultsContainer"></div>
    </div>
</div>

<script>
let currentRecommendations = [];

document.getElementById('generateBtn').addEventListener('click', generateRecommendations);

async function generateRecommendations() {
    const resultsContainer = document.getElementById('resultsContainer');
    const generateBtn = document.getElementById('generateBtn');
    
    try {
        generateBtn.disabled = true;
        generateBtn.textContent = '⏳ Generating...';
        
        CineSet.showLoading(resultsContainer);
        
        const response = await CineSet.apiFetch('/api/recommendations/', {
            method: 'POST',
            body: JSON.stringify({
                save_history: true,
                limit: 20
            })
        });
        
        currentRecommendations = response.recommendations;
        displayResults(response);
        
    } catch (error) {
        CineSet.showError(resultsContainer, error.message);
    } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '🎯 Generate Recommendations';
    }
}

function displayResults(data) {
    const resultsContainer = document.getElementById('resultsContainer');
    
    if (!data.recommendations || data.recommendations.length === 0) {
        resultsContainer.innerHTML = `
            <div class="card text-center">
                <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">🤷</div>
                <h3>No Recommendations Found</h3>
                <p class="text-secondary">
                    Try adjusting your preferences or selecting different genres.
                </p>
                <a href="{% url 'preferences' %}" class="btn btn-primary mt-3">
                    Update Preferences
                </a>
            </div>
        `;
        return;
    }
    
    // Summary card
    const summaryHtml = `
        <div class="card mb-4 fade-in">
            <div class="card-header">
                <h3 class="card-title">Results Summary</h3>
            </div>
            <div class="card-body">
                <div class="grid grid-4">
                    <div>
                        <strong>Total Results:</strong>
                        <div style="font-size: 1.5rem; color: var(--primary-color);">
                            ${data.count}
                        </div>
                    </div>
                    <div>
                        <strong>Preferred Genres:</strong>
                        <div class="text-secondary">
                            ${data.preferred_genres.join(', ')}
                        </div>
                    </div>
                    <div>
                        <strong>Match Type:</strong>
                        <div class="text-secondary">
                            ${data.match_type === 'OR' ? 'Union (OR)' : 'Intersection (AND)'}
                        </div>
                    </div>
                    <div>
                        <strong>Min Rating:</strong>
                        <div class="text-secondary">
                            ${data.min_rating}/10
                        </div>
                    </div>
                </div>
                ${data.excluded_genres && data.excluded_genres.length > 0 ? `
                    <div class="mt-3">
                        <strong>Excluded Genres:</strong>
                        <span class="text-secondary">${data.excluded_genres.join(', ')}</span>
                    </div>
                ` : ''}
            </div>
        </div>
    `;
    
    // Movies grid
    const moviesHtml = data.recommendations.map((rec, index) => {
        const movie = rec.movie;
        const genres = Array.isArray(movie.genres) ? movie.genres : [];
        const genreTags = genres.map(g => `<span class="genre-tag">${g}</span>`).join('');
        
        return `
            <div class="card fade-in" style="animation-delay: ${index * 0.05}s;">
                <div style="display: flex; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-md);">
                    <div style="font-size: 2rem; font-weight: 700; color: var(--primary-color);">
                        #${index + 1}
                    </div>
                    <div style="flex: 1;">
                        <h3 class="movie-title" style="margin-bottom: var(--spacing-xs);">
                            ${movie.title}
                        </h3>
                        ${movie.release_year ? `<div class="movie-year">${movie.release_year}</div>` : ''}
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--secondary-color);">
                            ${CineSet.formatSimilarity(rec.similarity_score)}
                        </div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">
                            Similarity
                        </div>
                    </div>
                </div>
                
                <div class="movie-genres mb-2">
                    ${genreTags}
                </div>
                
                ${movie.average_rating ? `
                    <div class="movie-rating mb-2">
                        ⭐ ${movie.average_rating}/10
                    </div>
                ` : ''}
                
                <div style="background-color: var(--background-secondary); padding: var(--spacing-sm); border-radius: var(--radius-sm); margin-top: var(--spacing-sm);">
                    <strong style="color: var(--text-secondary); font-size: 0.875rem;">Why this movie:</strong>
                    <p style="margin: var(--spacing-xs) 0 0 0; font-size: 0.875rem; color: var(--text-muted);">
                        ${rec.explanation}
                    </p>
                </div>
                
                <div style="margin-top: var(--spacing-sm); padding-top: var(--spacing-sm); border-top: 1px solid var(--border-color);">
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; color: var(--text-muted);">
                        <span>Operation: ${rec.operation}</span>
                        <span>✓ ${rec.matching_genres.length} matching genre${rec.matching_genres.length !== 1 ? 's' : ''}</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    resultsContainer.innerHTML = summaryHtml + `
        <div class="grid grid-2" style="gap: var(--spacing-md);">
            ${moviesHtml}
        </div>
    `;
}

// Load saved recommendations on page load (optional)
document.addEventListener('DOMContentLoaded', () => {
    // Auto-generate on first visit
    // generateRecommendations();
});
</script>
{% endblock %}
